{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Playlist Studio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'playlists/styles.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'playlists/search.css' %}?v=2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'playlists:home' %}">Playlist Studio</a>
    <span class="tagline">Your music, organized</span>
  </header>
  <main class="page-shell">
    {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
